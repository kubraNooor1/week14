name: wf-dev-lint

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Lint HTML files
        run: |
          npx htmlhint "**/*.html"
      
      - name: Lint CSS files (optional)
        run: |
          npx stylelint "**/*.css"
          
  build_job:
    needs: lint-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build with Parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"
